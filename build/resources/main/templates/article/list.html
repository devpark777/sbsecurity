<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::content}, 'Article List(글목록)')}">

<content>
  <h1>Article List</h1>

  <a class="btn" href="/articles/write">Write Article</a>

  <table>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Writer</th>
    </tr>

    <tr th:each="article : ${articles}">
      <td th:text="${article.id}"></td>
      <td>
        <a th:href="@{/articles/{id}(id=${article.id})}"
           th:text="${article.title}"></a>
      </td>
      <td th:text="${article.writer.name}"></td>
    </tr>
  </table>
</content>

</html>
